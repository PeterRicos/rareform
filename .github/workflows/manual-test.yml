name: Manual AI Bot
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What should the bot say?'
        required: true
        default: 'Hello world!'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call OpenRouter
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
        with:
          script: |
            try {
              const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + process.env.OPENROUTER_API_KEY,
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/" + context.repo.owner + "/" + context.repo.repo,
                  "X-Title": "Manual AI Bot"
                },
                body: JSON.stringify({
                  model: "meta-llama/llama-3.3-70b-instruct:free",
                  messages: [{ role: "user", content: process.env.PROMPT }]
                })
              });
              
              const data = await response.json();
              
              if (!response.ok) {
                core.setFailed("OpenRouter Error: " + JSON.stringify(data));
              } else if (data.choices && data.choices[0]) {
                core.info("✅ SUCCESS! The AI replied: " + data.choices[0].message.content);
              } else {
                core.setFailed("Unexpected Response: " + JSON.stringify(data));
              }
            } catch (error) {
              core.setFailed("Script Error: " + error.message);
            }
