name: Simple AI Test
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Ask the AI something'
        required: true
        default: 'Tell me a joke'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask AI
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
        with:
          script: |
            try {
              const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + process.env.OPENROUTER_API_KEY,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "meta-llama/llama-3.3-70b-instruct:free",
                  messages: [{ role: "user", content: process.env.PROMPT }]
                })
              });
              const data = await response.json();
              if (!response.ok) {
                core.info("❌ OpenRouter Error: " + JSON.stringify(data));
              } else {
                core.info("✅ SUCCESS! The AI said: " + data.choices[0].message.content);
              }
            } catch (error) {
              core.info("❌ Script Error: " + error.message);
            }
