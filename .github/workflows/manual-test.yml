name: Manual AI Bot
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What should the bot say?'
        required: true
        default: 'Hello world!'

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call OpenRouter and Post Comment
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
        with:
          script: |
            let result = "";
            try {
              const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + process.env.OPENROUTER_API_KEY,
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/" + context.repo.owner + "/" + context.repo.repo,
                  "X-Title": "Manual AI Bot"
                },
                body: JSON.stringify({
                  model: "meta-llama/llama-3.3-70b-instruct:free",
                  messages: [{ role: "user", content: process.env.PROMPT }]
                })
              });
              const data = await response.json();
              if (!response.ok) {
                result = "⚠️ OpenRouter Error (" + response.status + "): " + (data.error?.message || JSON.stringify(data));
              } else if (data.choices && data.choices[0]) {
                result = data.choices[0].message.content;
              } else {
                result = "⚠️ Unexpected Response: " + JSON.stringify(data);
              }
            } catch (error) {
              result = "⚠️ Script Error: " + error.message;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: result
            });
