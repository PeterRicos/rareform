name: Cline Issue Assistant
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: Check for @cline mention
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment?.body || "";
            const isPR = !!context.payload.issue?.pull_request;
            const hit = body.toLowerCase().includes("@cline");
            core.setOutput("hit", (!isPR && hit) ? "true" : "false");
            core.setOutput("issue_number", String(context.payload.issue?.number || ""));
            core.setOutput("issue_url", context.payload.issue?.html_url || "");
            core.setOutput("prompt", body.replace(/@cline/gi, "").trim());

      - name: Call OpenRouter and Post Comment
        if: steps.detect.outputs.hit == 'true'
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ steps.detect.outputs.issue_number }}
          ISSUE_URL: ${{ steps.detect.outputs.issue_url }}
          PROMPT: ${{ steps.detect.outputs.prompt }}
        with:
          script: |
            let result;
            try {
              const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${process.env.OPENROUTER_API_KEY}`,
                  "Content-Type": "application/json",
                  "HTTP-Referer": `https://github.com/${context.repo.owner}/${context.repo.repo}`,
                  "X-Title": "Cline Issue Assistant"
                },
                body: JSON.stringify({
                  model: "google/gemini-2.5-flash:free",
                  messages: [{ role: "user", content: `You are a helpful GitHub bot. The user opened an issue at ${process.env.ISSUE_URL}. The user's comment is: "${process.env.PROMPT}". Provide a helpful response.` }]
                })
              });
              
              const data = await response.json();
              
              if (!response.ok) {
                result = `⚠️ **OpenRouter Error:** ${data.error?.message || JSON.stringify(data)}`;
              } else if (data.choices && data.choices[0]) {
                result = data.choices[0].message.content;
              } else {
                result = `⚠️ **Unexpected API Response:**\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\``;
              }
            } catch (error) {
              result = `⚠️ **Script Error:** ${error.message}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: result
            });
            });
