name: Refresh index.html

# GitHub Pages sends "Cache-Control: max-age=600" with every file, so a deploy can
# sit behind a ten-minute cache while the URL stays the same. stamp-assets.js
# rewrites the styles.css/products.js/app.js references in index.html to
# "?v=<content hash>", which turns each deploy into new URLs. This runs on every
# push to main and commits the result, so a listing edit — or a commit from another
# workflow/agent — can never leave the page pointing at a previous file.
#
# The same push has to keep index.html's generated JSON-LD in step with the catalog,
# because that block is the only product data a crawler or unfurler gets from an HTML
# document on its own: build-jsonld.js writes it from products.js through jsonld.js,
# the same builder the shop page runs, so a listing edit can never leave the two
# describing different products.
#
# A third step is what gives each pair an address of its own.
# prerender-products.js writes /product/<slug>/index.html for every listing — its own
# title, canonical, Open Graph tags and Product JSON-LD, with the pair's details already
# in the markup — and rebuilds sitemap.xml from the same catalog. Without it a listing
# edit changes the shop while the listing pages still describe what was there before,
# which is exactly the staleness this workflow exists to prevent.
#
# All three steps are pure Node. build-images.js (the AVIF/WebP derivatives) is kept out
# on purpose: it needs sharp, a native dependency this static repo otherwise does not
# have, and its output is committed. Run it by hand after replacing one of the three
# source photos — test-images.js fails the build when that was forgotten.
#
# Every step writes only into the paths committed below (index.html, product/, sitemap.xml).
#
# Safe to delete: without it, run "node stamp-assets.js && node build-jsonld.js &&
# node prerender-products.js" yourself before pushing.

on:
  push:
    branches: [main]
    paths:
      - 'styles.css'
      - 'products.js'
      - 'jsonld.js'
      - 'app.js'
      - 'qrcode.js'
      - 'boot.js'
      - 'slugs.js'
      - 'index.html'
      - 'stamp-assets.js'
      - 'build-jsonld.js'
      - 'prerender-products.js'
      # Any test file: an edited assertion has to be re-run by the suite that holds it.
      - 'test-*.js'
      # The hero clip: dropping a new video/reel.mp4 has to re-stamp index.html like any
      # other asset change, or the swap would sit behind the ten-minute cache.
      - 'video/reel.mp4'
      # Freshly regenerated photo derivatives, whenever build-images.js has been run.
      - 'images/*.avif'
      - 'images/*.webp'
      - 'images/*.jpg'
      # This workflow itself, so a change to what CI runs is proofed by the run it changes.
      - '.github/workflows/stamp-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Two pushes in a row must not have two stampers racing each other to commit.
concurrency:
  group: stamp-assets
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the retry below can rebase onto a branch that moved.
          fetch-depth: 0

      - name: Stamp index.html asset hashes
        run: node stamp-assets.js

      - name: Rebuild the catalog JSON-LD in index.html
        run: node build-jsonld.js

      # One real page per listing, plus sitemap.xml. Runs after the stamping above so the
      # pages inherit the ?v= URLs written into index.html — otherwise a listing page
      # would keep pointing at the previous deploy's stylesheet for ten minutes.
      - name: Prerender /product/<slug>/ pages and the sitemap
        run: node prerender-products.js

      - name: Check the listing pages still describe the catalog
        run: node test-product-pages.js

      - name: Check the photo derivatives are not stale
        run: node test-images.js

      # index.html only turns the hero tag on when the clip is really here, so this step
      # is what proves the pairing held — and what refuses to let a clip that is not
      # actually a video (an .mp4 that has been through a text pipeline, say) go
      # unnoticed, since the page itself would just fall back to the still image.
      - name: Check the hero clip
        run: node test-hero-video.js

      # Cards are hidden until a scroll-reveal observer shows them, so a grid nobody
      # observed is indistinguishable from no results. This is the check that every
      # renderer arms it.
      - name: Check the card reveal
        run: node test-reveal.js

      # The shop answers by phone and text, so a real number has to reach a dialer — it
      # does not have to sit in the shipped files where a scraper reads it. This keeps it
      # split into groups in app.js/jsonld.js and absent from the markup.
      - name: Check the number stays out of the shipped files
        run: node test-privacy.js

      # The remaining six suites: routing, the small-screen layout, the zoom viewer, size
      # search, the listing QR codes and the category tiles. Each is pure Node, so all of
      # them together cost seconds — cheap enough that a merge which breaks one of them
      # should never reach Pages.
      - name: Check the rest of the suite
        run: |
          for t in test-route.js test-mobile.js test-zoom.js test-size-search.js \
                   test-listing-qr.js test-brand-tiles.js; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      - name: Commit the regenerated HTML when it was stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # index.html carries the ?v= stamps and the catalog block; product/ carries one
          # page per listing; sitemap.xml lists them. All three are written above and all
          # three have to land in the same commit, or the pages and the shop disagree.
          if git diff --quiet -- index.html product sitemap.xml; then
            echo "index.html, product/ and sitemap.xml already match the catalog; nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html product sitemap.xml
          git commit -m "Refresh index.html asset hashes, catalog JSON-LD and listing pages"

          for attempt in 1 2 3; do
            if git push; then break; fi
            echo "push rejected (another commit landed first); rebasing"
            git pull --rebase --autostash
          done

          # Commits pushed with the workflow token do not reliably start the Pages
          # build, so ask for one. Harmless if the push already started it.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "Pages build request ignored (the push may have started one)"